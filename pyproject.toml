[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gon-stock02"
version = "0.1.0"
description = "Four-stock paper trading research and validation"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "cryptography>=43",
    "websockets>=15,<18",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
gs02-buzz = "gon_stock02.buzz:main"
gs02 = "gon_stock02.cli:main"
gs02-web = "gon_stock02.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gon_stock02"]

[tool.hatch.build.targets.sdist]
only-include = ["src/gon_stock02", "tests", "config", "docs", "agents", "scripts/evolve_runtime.py", "README.md", "pyproject.toml", "uv.lock"]
